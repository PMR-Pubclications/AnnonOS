name: Sync AnnonOS to Trust-Shell

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AnnonOS-
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_PAT }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "AnnonOS Sync Bot"
          git config --global user.email "bot@annonos.internal"

      - name: Add Target Remote and Push Changes
        run: |
          git remote add target https://x-access-token:${{ secrets.SYNC_PAT }}@github.com/PMR-Pubclications/Trust-Shell.git
          git fetch target
          # Push changes to target main branch safely
          git push target main --force-with-lease || git push target main
