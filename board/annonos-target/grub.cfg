set default="0"
set timeout="5"

menuentry "AnnonOS - Sovereign Field Environment (Civilian / Trust Admin)" {
    linux /boot/bzImage root=/dev/sr0 ro quiet ANNONOS_DEVICE_ROLE=CIVILIAN_ADMIN
    initrd /boot/rootfs.cpio.gz
}

menuentry "AnnonOS - Tactical HUD Mode (First Responder)" {
    linux /boot/bzImage root=/dev/sr0 ro quiet ANNONOS_DEVICE_ROLE=FIRST_RESPONDER
    initrd /boot/rootfs.cpio.gz
}

menuentry "AnnonOS - Emergency Hardware Recovery & Shredder Test" {
    linux /boot/bzImage root=/dev/sr0 ro quiet ANNONOS_EMERGENCY_TEST=1
    initrd /boot/rootfs.cpio.gz
}
