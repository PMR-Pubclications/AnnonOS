set default="0"
set timeout="5"

# Buildroot's iso9660 image installs the kernel (bzImage) as /boot/vmlinuz
# and the initramfs (rootfs.cpio.gz) as /boot/initrd.
menuentry "AnnonOS - Sovereign Field Environment (Civilian / Trust Admin)" {
    linux /boot/vmlinuz quiet ANNONOS_DEVICE_ROLE=CIVILIAN_ADMIN
    initrd /boot/initrd
}

menuentry "AnnonOS - Tactical HUD Mode (First Responder)" {
    linux /boot/vmlinuz quiet ANNONOS_DEVICE_ROLE=FIRST_RESPONDER
    initrd /boot/initrd
}

menuentry "AnnonOS - Emergency Hardware Recovery & Shredder Test" {
    linux /boot/vmlinuz quiet ANNONOS_EMERGENCY_TEST=1
    initrd /boot/initrd
}
